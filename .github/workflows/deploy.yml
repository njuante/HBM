name: Desplegar

# Solo main, y solo si CI pasa: nada llega al servidor sin tests en verde.
on:
  push:
    branches: [main]
  workflow_dispatch: # para reintentar un despliegue a mano

concurrency:
  group: deploy-produccion
  cancel-in-progress: false # nunca cortar un despliegue a medias

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  imagen:
    name: Construir y publicar imagen
    needs: ci
    # Runner ARM nativo: la instancia de Oracle es Ampere (aarch64) y en repo
    # público estos runners son gratis. Emular ARM sobre x86 con QEMU tardaba
    # cuatro o cinco veces más.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # ghcr exige el nombre en minúsculas y el repo es «HBM».
      - name: Normalizar nombre de imagen
        id: nombre
        run: echo "ruta=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.nombre.outputs.ruta }}
          # `latest` es lo que sigue el servidor; el sha permite volver atrás.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # La caché vive en el propio registry: sin ella cada despliegue
          # recompila `npm ci` y el build de Next desde cero.
          cache-from: type=registry,ref=${{ steps.nombre.outputs.ruta }}:buildcache
          cache-to: type=registry,ref=${{ steps.nombre.outputs.ruta }}:buildcache,mode=max

  desplegar:
    name: Desplegar en Oracle
    needs: imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sin esto, con los secretos vacíos ssh recibe «@» como destino, escupe
      # su pantalla de ayuda y sale con 255: un error que no dice nada de lo
      # que en realidad falta.
      - name: Comprobar que están los secretos
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          faltan=()
          [ -n "$SSH_HOST" ] || faltan+=(SSH_HOST)
          [ -n "$SSH_USER" ] || faltan+=(SSH_USER)
          [ -n "$SSH_KEY" ]  || faltan+=(SSH_KEY)
          if [ ${#faltan[@]} -gt 0 ]; then
            echo "::error::Faltan estos secretos: ${faltan[*]}. Cómo darlos de alta, en el README (sección «Configurar GitHub»)."
            exit 1
          fi
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::warning::Sin SSH_KNOWN_HOSTS: se acepta la huella que responda en la primera conexión. Ver README."
          fi

      - name: Preparar SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Con SSH_KNOWN_HOSTS se fija la huella del servidor de antemano y
          # nadie puede colarse en medio. Sin él se acepta la primera que
          # responda (`accept-new`), que es cómodo pero confía a ciegas en esa
          # primera conexión; a partir de ahí sí queda anclada.
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
          fi
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            politica=yes
          else
            politica=accept-new
          fi
          cat > ~/.ssh/config <<CONF
          Host *
            StrictHostKeyChecking $politica
            UserKnownHostsFile ~/.ssh/known_hosts
          CONF
          chmod 600 ~/.ssh/config

      # El «Permission denied (publickey)» a secas no dice si el problema es la
      # clave, el usuario o que falta autorizarla en el servidor. Esto acota.
      - name: Comprobar el acceso SSH
        env:
          REMOTO_SSH: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          if ! head -1 ~/.ssh/id_deploy | grep -q "PRIVATE KEY"; then
            echo "::error::SSH_KEY no parece una clave privada. Tiene que ser el fichero sin «.pub», con sus líneas BEGIN y END."
            exit 1
          fi

          # La huella es pública: sirve para cotejarla con authorized_keys.
          huella=$(ssh-keygen -lf ~/.ssh/id_deploy | awk '{print $2}')
          echo "Clave de despliegue: $huella"

          if ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$REMOTO_SSH" 'echo "Conectado como $(whoami) en $(hostname)"'; then
            exit 0
          fi

          echo "::error::El servidor rechaza la clave. Comprueba, en este orden:"
          echo "  1. Que SSH_USER es el correcto (en Oracle suele ser 'ubuntu' u 'opc', nunca 'root')."
          echo "  2. Que la clave está autorizada:  ssh-copy-id -i ~/.ssh/hbm_deploy.pub USUARIO@IP"
          echo "  3. Que esta huella aparece en ~/.ssh/authorized_keys del servidor:"
          echo "     $huella"
          echo "     Compruébalo con:  ssh-keygen -lf ~/.ssh/authorized_keys"
          exit 1

      - name: Copiar compose y Caddyfile
        env:
          DESTINO: ${{ vars.DEPLOY_PATH || '/www/apps/hbm' }}
          REMOTO_SSH: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          # La carpeta no se crea desde aquí: en un servidor con aaPanel /www es
          # de root, así que un `mkdir` con el usuario de despliegue fallaría.
          # Se prepara una vez a mano, con su dueño correcto (ver README).
          if ! ssh -i ~/.ssh/id_deploy "$REMOTO_SSH" "[ -w '$DESTINO' ]"; then
            echo "::error::$DESTINO no existe o no es escribible por este usuario. Prepárala una vez con:"
            echo "  sudo mkdir -p $DESTINO && sudo chown -R \$USER:\$USER $DESTINO"
            exit 1
          fi
          scp -i ~/.ssh/id_deploy docker-compose.prod.yml Caddyfile \
            "$REMOTO_SSH:$DESTINO/"

      - name: Levantar la nueva versión
        env:
          DESTINO: ${{ vars.DEPLOY_PATH || '/www/apps/hbm' }}
          REMOTO_SSH: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy "$REMOTO_SSH" \
            "DESTINO='$DESTINO' bash -se" <<'REMOTO'
          set -euo pipefail
          cd "$DESTINO"

          if [ ! -f .env ]; then
            echo "::error::Falta $PWD/.env en el servidor (POSTGRES_PASSWORD y DOMAIN). Ver README."
            exit 1
          fi

          docker compose -f docker-compose.prod.yml pull
          # Las migraciones las aplica el propio contenedor al arrancar
          # (docker-entrypoint.sh -> prisma migrate deploy).
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          # Un `up -d` correcto no garantiza que sigan en pie: si Caddy no
          # puede tomar el 80 (aaPanel), sale a los pocos segundos y sin esta
          # comprobación el despliegue se daría por bueno. Se recorren los
          # servicios que el perfil activo define, para no exigir Caddy cuando
          # el proxy lo pone aaPanel.
          sleep 12
          for servicio in $(docker compose -f docker-compose.prod.yml config --services); do
            cid=$(docker compose -f docker-compose.prod.yml ps -q "$servicio" || true)
            if [ -z "$cid" ]; then
              echo "::error::El servicio '$servicio' no ha llegado a crearse"
              docker compose -f docker-compose.prod.yml logs --tail=40 "$servicio" || true
              exit 1
            fi
            estado=$(docker inspect -f '{{.State.Status}}' "$cid")
            if [ "$estado" != "running" ]; then
              echo "::error::El servicio '$servicio' no está en marcha (estado: $estado)"
              docker compose -f docker-compose.prod.yml logs --tail=40 "$servicio" || true
              exit 1
            fi
          done

          docker image prune -f
          REMOTO
        # `DESTINO` viaja en el entorno de la sesión remota.

      - name: Comprobar que responde
        run: |
          dominio="${{ vars.DOMAIN || 'procesozero.es' }}"
          for intento in $(seq 1 10); do
            codigo=$(curl -sS -o /dev/null -w '%{http_code}' "https://$dominio/login" || echo 000)
            if [ "$codigo" = "200" ]; then
              echo "✓ https://$dominio/login responde 200"
              exit 0
            fi
            echo "intento $intento: $codigo — esperando…"
            sleep 10
          done
          echo "::error::El sitio no respondió 200 tras el despliegue"
          exit 1
